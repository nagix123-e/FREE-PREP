[package]
name = "sat-practice-simulator"
version = "1.2.8"
description = "Free Practice Simulator for the SAT® Exam."
authors = ["FREE PREP"]
edition = "2021"

[lib]
name = "sat_practice_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.44"
tauri-plugin-biometry = "0.2"
