name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            bundles: "appimage,deb"
            artifact: linux-bundles
            release_suffix: linux
          - label: macOS
            os: macos-latest
            bundles: "dmg,app"
            artifact: macos-bundles
            release_suffix: macos
          - label: Windows
            os: windows-latest
            bundles: "nsis,msi"
            artifact: windows-bundles
            release_suffix: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build release bundles
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Prepare Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart("v")
          $output = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          Copy-Item $nsis.FullName (Join-Path $output "FREE-PREP_$releaseVersion`_windows-x64-setup.exe")
          Copy-Item $msi.FullName (Join-Path $output "FREE-PREP_$releaseVersion`_windows-x64.msi")

      - name: Prepare Linux release assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          cp "$appimage" "$RUNNER_TEMP/release-assets/FREE-PREP_${release_version}_linux-x86_64.AppImage"
          cp "$deb" "$RUNNER_TEMP/release-assets/FREE-PREP_${release_version}_linux-amd64.deb"

      - name: Prepare macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          cp "$dmg" "$RUNNER_TEMP/release-assets/FREE-PREP_${release_version}_macos.dmg"
          tar -C "$(dirname "$app")" -czf "$RUNNER_TEMP/release-assets/FREE-PREP_${release_version}_macos.app.tar.gz" "$(basename "$app")"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  release:
    name: Publish ${{ matrix.label }} Release
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            artifact: windows-bundles
            release_suffix: windows
          - label: Linux
            artifact: linux-bundles
            release_suffix: linux
          - label: macOS
            artifact: macos-bundles
            release_suffix: macos

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets

      - name: Create ${{ matrix.label }} Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-${{ matrix.release_suffix }}
          target_commitish: ${{ github.sha }}
          name: FREE PREP ${{ github.ref_name }} - ${{ matrix.label }}
          body: |
            FREE PREP desktop installer for ${{ matrix.label }}.

            Download ZIP is source code for developers. General users should download the installer for their operating system from this release.

            Not affiliated with or endorsed by College Board.
          prerelease: false
          files: release-assets/*
