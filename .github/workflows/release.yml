name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: nsis
          - label: Linux
            os: ubuntu-latest
            bundles: appimage
          - label: macOS
            os: macos-latest
            bundles: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Verify macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_KEY_P8"

      - name: Prepare macOS App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Prepare Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart("v")
          $output = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName (Join-Path $output "FREE-PREP_$releaseVersion`_windows-x64-setup.exe")

      - name: Prepare Linux release asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          cp "$appimage" "$RUNNER_TEMP/release-assets/FREE-PREP_${release_version}_linux-x86_64.AppImage"

      - name: Prepare macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          cp "$dmg" "$RUNNER_TEMP/release-assets/FREE-PREP_${release_version}_macos.dmg"

      - name: Upload OS release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-release-asset
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish combined release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: Windows-release-asset
          path: release-assets

      - name: Download Linux asset
        uses: actions/download-artifact@v4
        with:
          name: Linux-release-asset
          path: release-assets

      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: macOS-release-asset
          path: release-assets

      - name: Create combined release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: FREE PREP ${{ github.ref_name }}
          body: |
            FREE PREP desktop installers for Windows, Linux, and macOS.

            Download the single installer for your operating system from this release.

            Not affiliated with or endorsed by College Board.
          prerelease: false
          files: release-assets/*
